spring.application.name=backend

# Starting coin balance for a new game (used when no save file exists or after reset)
game.starting-coins=0

# Coin reward per correct answer, by difficulty
game.reward.easy=5
game.reward.medium=10
game.reward.hard=20

# Server port: bind to PORT injected by Render, fall back to 8080 locally
server.port=${PORT:8080}

# Comma-separated list of origins allowed to call /api/**
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
